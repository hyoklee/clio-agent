# P0.6/P2.3 (#1110/#1121): the clio-schemas consumer loop, proven in CI.
# clio-agent resolves the pinned clio-schemas package and verifies the export
# pipeline (copy + byte/set check of the IMMUTABLE schemas shipped in the
# package). The real record schemas move into the package in P2.1 (#1120),
# which also switches the pin to an exact released version.
name: schema-check
on:
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/schema-check.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/clio_agent/gact/artifacts/**"
      - "tests/test_schema_equality.py"
  pull_request:
    paths:
      - ".github/workflows/schema-check.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/clio_agent/gact/artifacts/**"
      - "tests/test_schema_equality.py"
jobs:
  clio-schemas-export-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # measured ~35 s
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Install clio-agent and the exact clio-schemas pin
        run: uv sync --frozen --extra dev
      - name: Export the immutable schemas and self-check the copy
        run: |
          uv run --no-sync python -m clio_schemas.export --out /tmp/clio-schemas-export
          uv run --no-sync python -m clio_schemas.export --out /tmp/clio-schemas-export --check
      - name: Run cross-repository schema equality suite
        run: uv run --no-sync pytest tests/test_schema_equality.py -q
